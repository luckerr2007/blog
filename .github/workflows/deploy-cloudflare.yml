name: Deploy production (Cloudflare Workers)

# master 即生产：push 到 master 即构建并 wrangler deploy 到 Worker `blog`，
# 也就是 www.taosu.dpdns.org / taosu.dpdns.org 直接换成新版本。
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm run build

      # 未配置 secret 时只跑构建、跳过发布，避免 push 直接红叉。
      # 配置方式：gh secret set CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID
      - name: Check Cloudflare credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "::warning::未配置 CLOUDFLARE_API_TOKEN，本次只构建不发布"
            echo "SKIP_DEPLOY=1" >> "$GITHUB_ENV"
          fi

      - name: Deploy to Cloudflare Workers
        if: env.SKIP_DEPLOY != '1'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
