# Pages CMS 2.x 配置（https://app.pagescms.org）
#
# 作用：网页端 / 手机端可视化编辑仓库里的 Markdown，改动以 commit 写回仓库，
#       Cloudflare 检测到 push 后自动重建。
#
# 三条硬规则：
# 1) 字段必须与 src/content.config.ts 的 zod schema 对齐，否则「保存成功但构建报错」；
# 2) 有正文的集合必须声明 body（body 是特殊键，映射 frontmatter 之下的正文）；
# 3) 主题会读但你不常改的字段，声明 hidden: true，否则整文件重写时被丢弃。
#
# 注意：2.x 的字段没有 list: true。字符串数组（如 tags）只能用
#       type: select + options.multiple，且选项必须预定义在下面的 values 里。

media:
  input: public/assets
  output: /assets
  rename: safe
  categories: [image]

content:
  # ── 文章 ───────────────────────────────────────────────
  - name: posts
    label: 📝 文章
    type: collection
    path: src/content/posts
    format: yaml-frontmatter
    # 中文标题会被 slugify 剔除，必须手动填 ASCII 文件名
    filename:
      template: "{year}-{month}-{day}-{primary}.md"
      field: create
    # 只支持精确名字，不支持 glob
    exclude: ["images"]
    view:
      primary: title
      fields: [title, published, category, draft, pinned]
      sort: [published, title]
      default:
        sort: published
        order: desc
    fields:
      - name: title
        label: 标题
        type: string
        required: true

      - name: published
        label: 发布日期
        type: date
        required: true
        options:
          time: false
          format: yyyy-MM-dd

      - name: updated
        label: 更新日期（可选）
        type: date
        default: ""
        options:
          time: false
          format: yyyy-MM-dd
      - name: description
        label: 摘要
        type: text
        description: 用于列表与 SEO，建议 60-120 字

      - name: image
        label: 封面图
        type: string
        description: 填 /assets/xxx.webp（媒体库上传后的路径），留空则用默认封面

      # 2.x 没有 list，字符串数组用 select + multiple，新标签需在此追加
      - name: tags
        label: 标签
        type: select
        options:
          multiple: true
          values:
            - Astro
            - Firefly
            - Cloudflare
            - Cloudflare Pages
            - Cloudflare Workers
            - Pages CMS
            - Waline
            - 建站
            - 博客
            - 前端
            - 工具
            - 折腾
            - 随笔
            - 家庭服务器
            - Ubuntu
            - Cloudflare Tunnel
            - macOS
            - 效率
            - FFmpeg
            - 音频
            - RSS
            - Hugo
            - 音乐
            - 年度总结
            - 阅读
            - Unix
            - 读书笔记
            - Android
            - 旧物利用
            - 生活
            - 桌面
            - FLAC
            - CD
            - beets
            - 数据库
            - 跑步
            - MVSEP
            - 网易云
            - 音频分离
            - Node.js
            - LEMOM
            - MIDI
            - MuScriptor
            - Apple Silicon
            - MusicParser
            - FastAPI
            - 音频解析
            - 本地服务

      - name: category
        label: 分类
        type: string

      - name: draft
        label: 草稿
        type: boolean
        default: false

      - name: pinned
        label: 置顶
        type: boolean
        default: false

      - name: comment
        label: 允许评论
        type: boolean
        default: true

      - name: series
        label: 系列
        type: string

      - name: seriesOrder
        label: 系列序号
        type: number

      - name: body
        label: 正文
        type: rich-text
        required: true
        options:
          format: markdown
          rename: true
          switcher: true

      # ── 隐藏字段（保留不丢）────────────────────────────
      - name: author
        type: string
        hidden: true

      - name: lang
        type: string
        hidden: true

      - name: sourceLink
        type: string
        hidden: true

      - name: licenseName
        type: string
        hidden: true

      - name: licenseUrl
        type: string
        hidden: true

      - name: password
        type: string
        hidden: true

      - name: passwordHint
        type: string
        hidden: true

      - name: prevTitle
        type: string
        hidden: true

      - name: prevSlug
        type: string
        hidden: true

      - name: nextTitle
        type: string
        hidden: true

      - name: nextSlug
        type: string
        hidden: true

  # ── 动态 ───────────────────────────────────────────────
  - name: dynamic
    label: 💬 动态
    type: collection
    path: src/content/dynamic
    format: yaml-frontmatter
    filename:
      template: "{year}-{month}-{day}-{hour}{minute}{second}.md"
      field: create
    view:
      primary: published
      fields: [published, pinned, location]
      sort: [published]
      default:
        sort: published
        order: desc
    fields:
      - name: published
        label: 发布时间
        type: date
        required: true
        options:
          time: true
          format: yyyy-MM-dd HH:mm:ss

      - name: pinned
        label: 置顶
        type: boolean
        default: false

      - name: location
        label: 位置
        type: string

      - name: body
        label: 正文
        type: rich-text
        required: true
        options:
          format: markdown

  # ── 静态页面（关于等）─────────────────────────────────
  - name: spec
    label: 📄 静态页面
    type: collection
    path: src/content/spec
    format: yaml-frontmatter
    fields:
      - name: body
        label: 正文
        type: rich-text
        required: true
        options:
          format: markdown

settings:
  content:
    # false = 按 schema 整文件重写（配合 hidden 字段避免残留脏字段）
    merge: false
