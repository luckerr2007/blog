# Pages CMS 内容模型（https://app.pagescms.org）
#
# 作用：在网页端 / 手机上可视化编辑仓库里的 Markdown，改动会以 commit 形式写回仓库，
#       Cloudflare Pages 检测到 push 后自动重建。
#
# 三条硬规则（改之前先读）：
# 1) 字段必须与 src/content.config.ts 的 zod schema 对齐，否则「保存成功但构建报错」；
# 2) 有正文的集合必须声明 body，否则保存时正文会被丢弃；
# 3) 主题会读取但你不常改的字段，必须声明 hidden: true，否则整文件重写时被丢掉。

media:
  - name: assets
    label: 站点图片（public/assets）
    input: public/assets
    output: /assets
    categories: [image]

  - name: post-images
    label: 文章配图（src/content/posts/images）
    input: src/content/posts/images
    output: /src/content/posts/images
    categories: [image]

content:
  # ── 文章 ───────────────────────────────────────────────
  - name: posts
    label: 📝 文章
    type: collection
    path: src/content/posts
    format: yaml-frontmatter
    # 中文会被 slugify 剔除，必须让用户手动填 ASCII 文件名
    filename:
      template: "{year}-{month}-{day}-{primary}.md"
      field: create
    # 只支持精确名字，不支持 glob
    exclude: ["images"]
    view:
      primary: title
      sort: ["published desc", "title asc"]
      fields: [title, published, category, draft, pinned]
    fields:
      - name: title
        label: 标题
        type: string
        required: true

      - name: published
        label: 发布日期
        type: date
        required: true
        options:
          time: false
          format: yyyy-MM-dd

      - name: description
        label: 摘要
        type: text
        description: 用于列表与 SEO，建议 60-120 字

      - name: image
        label: 封面图
        type: string
        description: 相对文章目录（如 ./cover.webp）或完整 URL；留空则用站点默认封面

      - name: tags
        label: 标签
        type: string
        list: true

      - name: category
        label: 分类
        type: string

      - name: draft
        label: 草稿
        type: boolean
        default: false

      - name: pinned
        label: 置顶
        type: boolean
        default: false

      - name: comment
        label: 允许评论
        type: boolean
        default: true

      - name: series
        label: 系列
        type: string

      - name: seriesOrder
        label: 系列序号
        type: number

      - name: body
        label: 正文
        type: rich-text
        required: true

      # ── 隐藏字段（保留不丢）────────────────────────────
      - name: author
        label: 作者
        type: string
        hidden: true

      - name: lang
        label: 语言
        type: string
        hidden: true

      - name: sourceLink
        label: 来源链接
        type: string
        hidden: true

      - name: licenseName
        label: 许可证名称
        type: string
        hidden: true

      - name: licenseUrl
        label: 许可证链接
        type: string
        hidden: true

      - name: password
        label: 访问密码
        type: string
        hidden: true

      - name: passwordHint
        label: 密码提示
        type: string
        hidden: true

      - name: prevTitle
        label: 上一篇标题（主题内部）
        type: string
        hidden: true

      - name: prevSlug
        label: 上一篇 slug（主题内部）
        type: string
        hidden: true

      - name: nextTitle
        label: 下一篇标题（主题内部）
        type: string
        hidden: true

      - name: nextSlug
        label: 下一篇 slug（主题内部）
        type: string
        hidden: true

  # ── 动态 ───────────────────────────────────────────────
  - name: dynamic
    label: 💬 动态
    type: collection
    path: src/content/dynamic
    format: yaml-frontmatter
    filename:
      template: "{year}-{month}-{day}-{hour}{minute}{second}.md"
      field: create
    view:
      primary: published
      sort: ["published desc"]
      fields: [published, pinned, location]
    fields:
      - name: published
        label: 发布时间
        type: date
        required: true
        options:
          time: true
          format: yyyy-MM-dd HH:mm:ss

      - name: pinned
        label: 置顶
        type: boolean
        default: false

      - name: location
        label: 位置
        type: string

      - name: body
        label: 正文
        type: rich-text
        required: true

  # ── 静态页面（关于等）─────────────────────────────────
  - name: spec
    label: 📄 静态页面
    type: collection
    path: src/content/spec
    format: yaml-frontmatter
    view:
      primary: ""
    fields:
      - name: body
        label: 正文
        type: rich-text
        required: true

settings:
  content:
    # 整文件重写，配合 hidden 字段避免残留脏字段
    merge: false
